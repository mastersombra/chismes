name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Flutter App
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true

    - name: 📦 Get dependencies
      run: flutter pub get

    - name: 🔧 Create mock .env file
      run: |
        echo "SUPABASE_URL=https://mock.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=mock-key-for-ci" >> .env

    - name: 🔍 Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      continue-on-error: true

    - name: 🔎 Analyze code
      run: flutter analyze

    - name: 🧪 Run tests with coverage
      run: flutter test --coverage

    # Meta del proyecto: >85% sin lib/l10n (código generado). Umbral 88% = margen.
    # Ver docs/TEST_PLAN_85.md. lcov --remove no se usa (falla con lcov 2.6).
    - name: 🎯 Enforce coverage threshold (sin lib/l10n, mínimo 88%)
      run: |
        awk -v min=88 '
          /^SF:/ { skip = ($0 ~ /lib\/l10n\//) }
          /^LF:/ && !skip { lf += substr($0, 4) }
          /^LH:/ && !skip { lh += substr($0, 4) }
          END {
            pct = lh * 100 / lf
            printf "Coverage sin l10n: %.2f%% (%d/%d), mínimo %d%%\n", pct, lh, lf, min
            if (pct < min) { printf "::error::Coverage sin l10n %.2f%% < %d%%\n", pct, min; exit 1 }
          }' coverage/lcov.info

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-chismes
        fail_ci_if_error: false
        verbose: true

  build:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.4'
        channel: 'stable'
        cache: true

    - name: 📦 Get dependencies
      run: flutter pub get

    - name: 🔧 Create mock .env file
      run: |
        echo "SUPABASE_URL=https://mock.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=mock-key-for-ci" >> .env

    - name: 🔨 Build APK
      run: flutter build apk --release --no-shrink
      continue-on-error: true

    - name: 📦 Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
